# Builds the desktop installers on native runners and publishes them as a
# GitHub release. Push a version tag to cut a release:
#
#   npm version 3.0.1 && git push --follow-tags
#
# Builds are not signed or notarized (no Apple / Windows certificates), so
# macOS Gatekeeper and Windows SmartScreen warn on first launch.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds the installers as workflow artifacts, no release

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            args: --mac --arm64 --x64
          - name: Windows
            os: windows-latest
            args: --win --x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test and lint
        if: matrix.name == 'macOS'
        run: |
          npm test
          npm run lint

      - name: Build installers
        run: node scripts/build-prod.js ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
